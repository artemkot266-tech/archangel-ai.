name: Build APK

on:
  push:
    branches: [ main, 'proposal/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          # Ключ загрузки Google Play — из секретов (если добавлены)
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            echo "HAS_UPLOAD_KEY=true" >> $GITHUB_ENV
          fi
          # Версия для Play собирается всегда (проверка), но публикуется только с настоящим ключом
          TASKS="testFullDebugUnitTest assembleFullRelease bundlePlayRelease"
          ./gradlew $TASKS --no-daemon --stacktrace 2>&1 | tee build.log
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}

      # Ошибки компиляции публикуются как аннотации — их видно на странице запуска.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|Could not|FAILED|expected:|Exception|AssertionError" build.log | grep -v "> Task" | head -45 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            NAME="ARCHANGEL_AI-$VERSION.apk"
            echo "TAG=build-${{ github.run_number }}" >> $GITHUB_ENV
            echo "TITLE=ARCHANGEL AI $VERSION (сборка ${{ github.run_number }})" >> $GITHUB_ENV
            echo "IS_MAIN=true" >> $GITHUB_ENV
          else
            # Предложение агента: отдельная тестовая сборка, не «последняя».
            SLUG="${GITHUB_REF_NAME#proposal/}"
            NAME="ARCHANGEL_AI-$VERSION-test-$SLUG.apk"
            echo "TAG=proposal-${{ github.run_number }}" >> $GITHUB_ENV
            echo "TITLE=Предложение: $SLUG (сборка ${{ github.run_number }})" >> $GITHUB_ENV
            echo "IS_MAIN=false" >> $GITHUB_ENV
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/full/release/app-full-release.apk "$NAME"
          # Пакет для Google Play (.aab), если собран
          if [ "$HAS_UPLOAD_KEY" = "true" ] && [ -f app/build/outputs/bundle/playRelease/app-play-release.aab ]; then
            cp app/build/outputs/bundle/playRelease/app-play-release.aab "ARCHANGEL_AI-$VERSION-google-play.aab"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ARCHANGEL_AI-apk
          path: |
            ARCHANGEL_AI-*.apk
            ARCHANGEL_AI-*.aab

      # Каждая успешная сборка выкладывается в Releases: оттуда APK удобно скачать с телефона.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITLE }}
          body: "Список изменений — в CHANGELOG.md (для предложений — в PROPOSALS.md ветки). Установите APK на телефон."
          files: |
            ARCHANGEL_AI-*.apk
            ARCHANGEL_AI-*.aab
          prerelease: ${{ env.IS_MAIN != 'true' }}
          make_latest: ${{ env.IS_MAIN == 'true' }}
